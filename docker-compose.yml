version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: luminous-db
    environment:
      POSTGRES_DB: luminous_banking
      POSTGRES_USER: luminous
      POSTGRES_PASSWORD: luminous_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luminous -d luminous_banking"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luminous-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/luminous_banking
      SPRING_DATASOURCE_USERNAME: luminous
      SPRING_DATASOURCE_PASSWORD: luminous_secure_password
      AI_SERVICE_URL: http://ai-workflow:8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luminous-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend

  ai-workflow:
    build:
      context: ./ai-workflow
      dockerfile: Dockerfile
    container_name: luminous-ai
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

